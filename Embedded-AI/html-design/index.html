<body>
<canvas id="world" aria-label="一群候鸟飞越不断变化的大地"></canvas><div id="grain"></div>
<div id="brand" class="ui"><strong>候鸟 · MIGRATION</strong><div id="region">WARM · 暖纸</div><div id="shot">正俯视 · VAR 01</div><div id="journey"><span id="distance">000.0 KM</span><span id="journeyTrack"><i id="journeyFill"></i></span></div></div>

<div id="intro"><div class="introCard"><div class="eyebrow">AN INFINITE GENERATIVE JOURNEY</div><div class="title">候鸟</div><div class="sub">M I G R A T I O N</div><div class="places"><button class="place active" data-place="0">暖纸</button><button class="place" data-place="2">暮粉</button><button class="place" data-place="4">夜航</button><button class="place" data-place="1">雾境</button><button class="place" data-place="3">雪境</button></div><button id="start">开始迁徙 →</button><div class="note">建议开启声音 · 移动光标成为风</div></div></div>
<script>
(()=>{'use strict';
window.__migrationErrors=[];addEventListener('error',e=>window.__migrationErrors.push(e.message));
const C=document.querySelector('#world'),ctx=C.getContext('2d',{alpha:false});

const noise=x=>{let i=Math.floor(x),f=smooth(x-i);return lerp(HSH(i),HSH(i+1),f)};
const STYLES=[
 {id:'WARM',cn:'暖纸',sky:'#eee6d5',ground:'#d5c9a9',field:'#b8a982',river:'#879da1',ink:'#3a362c',fog:'#eadfcb',bird:'#eee9dc',accent:'#b67a4a'},
 {id:'MIST',cn:'雾境',sky:'#d8ddd9',ground:'#b8c0b7',field:'#9fad9f',river:'#758f96',ink:'#354044',fog:'#e8ece9',bird:'#e8e8e1',accent:'#75898a'},
 {id:'DUSK',cn:'暮粉',sky:'#d9b3aa',ground:'#aa8c82',field:'#8f7a72',river:'#696f7d',ink:'#473a3c',fog:'#d9b9b0',bird:'#eadbd3',accent:'#cd735f'},
 {id:'SNOW',cn:'雪境',sky:'#cbd5d8',ground:'#dce0dc',field:'#c8cfca',river:'#829ca8',ink:'#34434a',fog:'#edf1ef',bird:'#f2f3ee',accent:'#9fb6bd'},
 {id:'NIGHT',cn:'夜航',sky:'#101827',ground:'#172331',field:'#202f3a',river:'#263947',ink:'#dce4e5',fog:'#1d2937',bird:'#b9c7d0',accent:'#e3bd73'}].map(s=>Object.fromEntries(Object.entries(s).map(([k,v])=>[k,v[0]==='#'?hex(v):v])));

const scol=(s,key)=>mix(s.a[key],s.b[key],s.t);
function resize(){let portrait=matchMedia('(orientation:portrait) and (max-width:900px)').matches;W=portrait?innerHeight:innerWidth;H=portrait?innerWidth:innerHeight;DPR=Math.min(devicePixelRatio||1,2);C.width=W*DPR;C.height=H*DPR;C.style.width=W+'px';C.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)} addEventListener('resize',resize);resize();

// camera: 16 authored poses, woven into a new continuous 96s variation each lap
const SHOTS=[
 ['正俯视',0,-1.48,1850,0,0],['俯冲',.12,-.92,1050,120,0],['贴河掠水',-.18,-.23,630,-40,-540],['沿河前推',.03,-.36,820,420,-430],
 ['侧向轨道',1.52,-.48,980,80,0],['低空宽景',-.8,-.27,1580,200,0],['环绕',2.3,-.56,930,0,0],['拉远揭示',-.35,-.75,2200,0,0],
 ['正背面',Math.PI,-.2,720,-120,0],['迎面',0,-.18,760,190,0],['高空漂移',.7,-1.16,1800,0,0],['河湾斜视',-.65,-.62,1100,160,-250],
 ['掠过屋脊',1.02,-.31,760,250,160],['雁阵近景',2.75,-.13,520,0,0],['云下远眺',-.2,-.48,2500,300,0],['回望大地',-2.45,-.82,1500,-80,0]
];
let shotPlan=[],lap=-1,manual={yaw:0,pitch:0,zoom:0},observe={zoom:0,lift:0,last:0};
function makePlan(n){let finale=n%2?9:8,p=[0],pools=[[1,4,6,11],[3,5,12,13],[2,5,6,13],[finale],[10,15]];for(let i=0;i<pools.length;i++){let candidates=pools[i].filter(v=>Math.abs(Math.atan2(Math.sin(SHOTS[v][1]-SHOTS[p.at(-1)][1]),Math.cos(SHOTS[v][1]-SHOTS[p.at(-1)][1])))>=.52);let a=candidates.length?candidates:pools[i];p.push(a[Math.floor(HSH(n*19+i)*a.length)])}return p}
function cameraPose(){let n=Math.floor(time/96);if(n!==lap){lap=n;shotPlan=makePlan(n)}let q=(time%96)/16,k=Math.floor(q),f=q-k,hold=.46,u=f<hold?0:smooth((f-hold)/(1-hold));let ia=shotPlan[k%6],ib=shotPlan[(k+1)%6],a=SHOTS[ia],b=SHOTS[ib];let unroll=(x,y)=>{while(y-x>Math.PI)y-=TAU;while(y-x<-Math.PI)y+=TAU;return y};let yaw=lerp(a[1],unroll(a[1],b[1]),u),pitch=lerp(a[2],b[2],u),dist=lerp(a[3],b[3],u)*(.88+(n%2)*.18+HSH(n*37+k)*.1);if(auto){let idle=clamp((time-observe.last-2)/3,0,1);observe.zoom*=1-idle*.025;observe.lift*=1-idle*.025}else{yaw+=manual.yaw;pitch=clamp(pitch+manual.pitch,-1.5,-.08);dist*=Math.exp(manual.zoom)}dist*=Math.exp(observe.zoom);pitch-=observe.lift;let target={x:travel+lerp(a[4],b[4],u),y:lerp(a[5],b[5],u),z:270};let cp=Math.cos(pitch);let pos={x:target.x-Math.cos(yaw)*cp*dist,y:target.y-Math.sin(yaw)*cp*dist,z:target.z-Math.sin(pitch)*dist};$('#shot').textContent=`${a[0]} · VAR ${String(n+1).padStart(2,'0')}`;return {pos,target,name:a[0]}}
let CAM,basis;
function cameraBasis(cam){let f=norm(sub(cam.target,cam.pos)),r=norm(cross(f,{x:0,y:0,z:1})),u=cross(r,f);return {f,r,u}}
const sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z}),dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,cross=(a,b)=>({x:a.y*b.z-a.z*b.y,y:a.z*b.x-a.x*b.z,z:a.x*b.y-a.y*b.x}),norm=a=>{let d=Math.hypot(a.x,a.y,a.z)||1;return{x:a.x/d,y:a.y/d,z:a.z/d}};

function poly(points,fill,stroke=null,lw=1){let ps=points.map(project);if(ps.some(p=>!p))return;ctx.beginPath();ctx.moveTo(ps[0].x,ps[0].y);for(let i=1;i<ps.length;i++)ctx.lineTo(ps[i].x,ps[i].y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function worldLine(points,stroke,lw=1){let ps=points.map(project);if(ps.some(p=>!p))return;ctx.beginPath();ctx.moveTo(ps[0].x,ps[0].y);for(let i=1;i<ps.length;i++)ctx.lineTo(ps[i].x,ps[i].y);ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}

const riverY=x=>Math.sin(x*.00072)*420+Math.sin(x*.00173+1.4)*150;
function terrain(){let range=4300,cell=520,x0=Math.floor((travel-range)/cell)*cell,x1=travel+range,cells=[];for(let x=x0;x<x1;x+=cell)for(let y=-2600;y<2600;y+=cell){let s=styleAt(x,y),p=project({x:x+cell/2,y:y+cell/2,z:0});if(!p)continue;cells.push({z:p.z,x,y,s})}cells.sort((a,b)=>b.z-a.z);for(const o of cells){let {x,y,s}=o,shade=(HSH(x*.013+y*.017)-.5)*.16,c=mix(s.a.field,s.b.field,clamp(s.t+shade,0,1));poly([{x,y,z:0},{x:x+cell,y,z:0},{x:x+cell,y:y+cell,z:0},{x,y:y+cell,z:0}],c,alpha(s.a.ink,.105),.55)}}
function riverRibbon(){let step=130,from=Math.floor((travel-4700)/step)*step,segs=[];for(let x=from;x<travel+4800;x+=step){let mid=x+step*.5,p=project({x:mid,y:riverY(mid),z:3});if(p)segs.push({x,z:p.z,s:styleAt(mid,riverY(mid))})}segs.sort((a,b)=>b.z-a.z);for(const o of segs){let x=o.x,y0=riverY(x),y1=riverY(x+step),w0=165+noise(x*.0019)*85,w1=165+noise((x+step)*.0019)*85,s=o.s;poly([{x,y:y0-w0-38,z:1},{x:x+step,y:y1-w1-38,z:1},{x:x+step,y:y1+w1+38,z:1},{x,y:y0+w0+38,z:1}],alpha(s.a.ink,.1));poly([{x,y:y0-w0,z:2},{x:x+step,y:y1-w1,z:2},{x:x+step,y:y1+w1,z:2},{x,y:y0+w0,z:2}],scol(s,'river'),alpha(s.a.sky,.19),.6);let night=s.a.id==='NIGHT'?(1-s.t):s.b.id==='NIGHT'?s.t:0;if(night<.75&&HSH(x*.03)>.38){let yy=lerp(y0-w0*.7,y0+w0*.7,HSH(x*.071)),a=project({x:x+step*.18,y:yy,z:4}),b=project({x:x+step*.72,y:yy+(y1-y0)*.5,z:4});if(a&&b){ctx.strokeStyle=alpha(s.a.sky,.13*(1-night));ctx.lineWidth=Math.max(.45,a.sc);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}}}
function worldObjectList(){let list=[],h0=Math.floor((travel-4400)/205),h1=Math.floor((travel+4500)/205);for(let i=h0;i<h1;i++){if(HSH(Math.floor(i/9)+17)>.18){let x=i*205,side=HSH(Math.floor(i/7)+8)>.5?1:-1,y=riverY(x)+side*(350+HSH(i*3)*90),p=project({x,y,z:100});if(p)list.push({type:'house',x,y,z:p.z,seed:i,side});if(HSH(i+30)>.78){let by=riverY(x)-side*(720+HSH(i)*330),bp=project({x,y:by,z:80});if(bp)list.push({type:'house',x:x+40,y:by,z:bp.z,seed:i+900,side:-side,back:true})}}if(HSH(i+91)>.965){let x=i*205,y=riverY(x)+(HSH(i+6)>.5?1:-1)*570,p=project({x,y,z:280});if(p)list.push({type:'church',x,y,z:p.z,seed:i})}}let t0=Math.floor((travel-4300)/245),t1=Math.floor((travel+4400)/245);for(let i=t0;i<t1;i++)if(HSH(i+41)>.1){let x=i*245+HSH(i)*120,y=riverY(x)+(HSH(i+22)-.5)*2600,p=project({x,y,z:55});if(p)list.push({type:'tree',x,y,z:p.z,seed:i*3})}return list}

document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&started)try{window.wakeLockHandle=await navigator.wakeLock?.request?.('screen')}catch(e){}});
let preview=new URLSearchParams(location.search);if(preview.has('preview')){startStyle=clamp(+(preview.get('style')||0),0,4);started=true;last=performance.now()/1000;$('#intro').classList.add('gone');nextVerse()}
})();
</script>
</body>
</html>
