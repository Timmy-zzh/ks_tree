<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办清单</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="todo-box">
    <h1>我的待办清单</h1>

    <div class="input-area">
      <input type="text" placeholder="请输入待办事项">
      <button>添加</button>
    </div>

    <ul class="todo-list">
      <li>
        <label class="todo-item">
          <input type="checkbox">
          <span>学习基础网页代码</span>
        </label>
      </li>
      <li>
        <label class="todo-item">
          <input type="checkbox" checked>
          <span>完成今天的待办事项</span>
        </label>
      </li>
    </ul>
  </div>
</body>
</html>
